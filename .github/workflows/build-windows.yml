name: Build Windows Executable (OnboardCheck)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend (Vite)
        run: npm run build

      - name: Build Tauri app (release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'OnboardCheck v__VERSION__'
          releaseBody: 'Automated build of OnboardCheck for Windows'
          releaseDraft: true
          prerelease: false

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: OnboardCheck-Windows-x64-portable
          path: src-tauri/target/release/onboardx.exe

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: OnboardCheck-Windows-x64-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: OnboardCheck-Windows-x64-msi
          path: src-tauri/target/release/bundle/msi/*.msi
